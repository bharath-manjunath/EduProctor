   <div class="container-fluid">
    <div class="mt-3 mb-3 text-center">
      <h2>📜 Available Examinations 📜</h2>
    </div>
  
    <div class="row">
      <div class="col-md-12" *ngFor="let examination of examinations">
        <mat-card class="mb-3">
          <mat-card-header>
            <mat-card-title>📝 {{ examination.title }} 📝</mat-card-title>
            <mat-card-subtitle>➡️ {{ examination.category?.title }} ⬅️</mat-card-subtitle>
          </mat-card-header>
  
          <mat-card-content>
            <p [innerHTML]="examination.description"></p>
          </mat-card-content>
  
          <mat-card-actions>
            <div class="button-container">
              <button mat-button color="primary" [routerLink]="'/userdashboard/examination-intro/' + examination.eid">
                View
              </button>
              <button mat-button color="accent">Questions: {{ examination.numOfQuestions }}</button>
              <button mat-button color="accent">Max Marks: {{ examination.maxMarks }}</button>
            </div>
          </mat-card-actions>
        </mat-card>
      </div>
  
      <div class="col-md-12" *ngIf="examinations.length === 0">
        <mat-card>
          <mat-card-content>
            <h3>No examinations available in this category.</h3>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
