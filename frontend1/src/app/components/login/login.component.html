<div class="container">
    <h2>Login</h2>
    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="userName">Username</label>
        <input type="text" id="userName" name="userName" class="form-control" required [(ngModel)]="authRequest.userName">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required [(ngModel)]="authRequest.password">
      </div>
      <button type="submit" class="btn btn-primary mt-3">Login</button>
    </form>
  </div>
